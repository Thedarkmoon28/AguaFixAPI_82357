services:
  api:
    image: thedarkmoonx28/aguafix-api:latest
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node node_modules/typeorm/cli.js -d dist/db/data-source.js migration:run && node dist/main"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME}
    volumes:
      - postgres_data_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data_db:
