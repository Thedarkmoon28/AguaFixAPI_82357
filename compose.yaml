services:
  postgres:
    image: postgis/postgis:16-master
    container_name: water-reports-api-db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
    volumes:
      - postgres_data_db:/var/lib/postgresql/data
 
  redis:
    image: redis
    container_name: water-reports-api-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data_db:/data
 
volumes:
  postgres_data_db:
  redis_data_db:
